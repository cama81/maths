<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matematica in gioco – Seconda</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9b6bd6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matematica">
<script>
// Se qualcosa va storto all'avvio mostra l'errore invece di una pagina vuota
window.addEventListener('error', function (e) {
  var a = document.getElementById('app');
  if (a && a.textContent.trim() === 'Caricamento…') a.innerHTML = '<p style="padding:20px">Errore: ' + e.message + '</p>';
});
</script>
</head>
<body>
<div id="app"><p style="text-align:center;padding:30px">Caricamento…</p></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<input type="file" id="sfile" accept=".json,application/json" hidden>
<!-- script classici (non moduli); l'ordine conta -->
<script src="js/utils.js"></script>

<script src="js/audio.js"></script>
<script src="js/models.js"></script>
<script src="js/stats.js"></script>
<script src="js/custom.js"></script>
<script src="js/render.js"></script>
<script src="js/statsui.js"></script>

<script src="js/pwa.js"></script>
</body>
</html>
